<style>
/* Layout: one phone-width app column; sticky brand header, scrolling screen, fixed bottom tab bar. Brand cues from beartownroad.org (navy, teal, gold, near-black, pill buttons, bold wide grotesk headings). */
:root{
  --navy:#24466B; --teal:#1995A4; --gold:#F1C84B; --ink:#1C1C1C;
  --bg:#F4F6F8; --surface:#FFFFFF; --fg:#1C1C1C; --muted:#5C6672; --line:#E2E6EB;
  --chip:#E8F4F6; --chip-fg:#11707C; --head:#24466B; --head-fg:#FFFFFF;
  --warn-bg:#FFF5D6; --warn-fg:#6B5200; --ok-bg:#E4F5EA; --ok-fg:#1F6B3A; --alert-bg:#FDECEC; --alert-fg:#8A1F1F;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1720; --surface:#18232F; --fg:#EEF2F6; --muted:#9AA7B4; --line:#2A3846;
  --chip:#133841; --chip-fg:#7FD3DD; --head:#16304C; --head-fg:#FFFFFF;
  --warn-bg:#3A3110; --warn-fg:#F6DA86; --ok-bg:#163423; --ok-fg:#8FDBA9; --alert-bg:#3B1A1A; --alert-fg:#F3A6A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#18232F; --fg:#EEF2F6; --muted:#9AA7B4; --line:#2A3846;
  --chip:#133841; --chip-fg:#7FD3DD; --head:#16304C; --head-fg:#FFFFFF;
  --warn-bg:#3A3110; --warn-fg:#F6DA86; --ok-bg:#163423; --ok-fg:#8FDBA9; --alert-bg:#3B1A1A; --alert-fg:#F3A6A6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}

.notice.alert{background:var(--alert-bg);color:var(--alert-fg)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}

.stat span{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}

svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.sheet-bg{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;
  padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.guess{font-size:11px;font-weight:700;color:var(--warn-fg);background:var(--warn-bg);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle;white-space:nowrap}
.kid{display:flex;align-items:center;gap:12px}
</style>
<style>

.bubble .t{font-size:10.5px;opacity:.7}

.thread header{background:var(--head);color:#fff;display:flex;align-items:center;gap:8px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

.thread form{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}

.sendbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}

.arch{background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center}

<script>
const IC = {
  sched:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/>',
  svc:'<path d="M4 6h11M4 11h11M4 16h7"/><circle cx="17" cy="17" r="2.5"/><path d="M19.5 17V7l2-1"/>',
  song:'<rect x="5" y="3" width="16" height="16" rx="2"/><circle cx="12" cy="13" r="2"/><path d="M14 13V7l2-1M3 7v14h14"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/>',
  approve:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h4M8 14h3M14 14l2 2 3-4"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  note:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"/><path d="M9 13l2 2 4-4"/>',
  sync:'<path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/>',
  arch:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/>',
  chev:'<path d="M9 6l6 6-6 6"/>', back:'<path d="M15 6l-6 6 6 6"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  send:'<path d="M4 12l16-8-6 16-2-6z"/>', check:'<path d="M5 12l5 5 9-10"/>', family:'<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 2.5-5 5-5s5 2 5 5M13.5 20c.3-2.4 1.8-4 3.5-4s3.5 1.6 3.5 4"/>',
  busy:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 13l4 4M14 13l-4 4"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', group:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5M15 15.5c2.6 0 5 1.6 5 4.5"/>'
};
const ic = (n, c='i') => `<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Mock Planning Center data (fictional people) ---------- */
// 4 leaders, 4 approved adults, 4 youth, 1 parent (all fictional)
const PEOPLE = {
  bryson:{n:'Bryson', r:'Youth Director', adult:true, leader:true}, sarah:{n:'Sarah Lin', r:'Worship Leader · Vocals', adult:true, leader:true},
  mike:{n:'Mike Torres', r:'Band Leader · Drums', adult:true, leader:true}, jen:{n:'Jen Park', r:'Youth Worship Leader · Keys', adult:true, leader:true},
  rachel:{n:'Rachel Moore', r:'Vocals', adult:true}, dave:{n:'Dave Reese', r:'Sound', adult:true}, tom:{n:'Tom Becker', r:'Bass', adult:true}, lisa:{n:'Lisa Grant', r:'Lyrics & Slides', adult:true},
  maya:{n:'Maya Thompson', r:'Vocals', youth:true, g:'Grade 10'}, caleb:{n:'Caleb Ward', r:'Acoustic Guitar', youth:true, g:'Grade 11'},
  ella:{n:'Ella Shaw', r:'Keys', youth:true, g:'Grade 9'}, josh:{n:'Josh Kim', r:'Bass', youth:true, g:'Grade 12'},
  dana:{n:'Dana Thompson', r:'Maya’s parent', parent:true}
};
const kind = id => PEOPLE[id].leader?'Leader':PEOPLE[id].youth?'Youth':PEOPLE[id].parent?'Parent':'Adult';
const first = id => PEOPLE[id].n.split(' ')[0];
const initials = id => PEOPLE[id].n.split(' ').map(x=>x[0]).join('').slice(0,2);

/* Leader-in-the-loop rule: returns {ok, approval, msg} */
function checkChat(creator, others){
  const c=PEOPLE[creator], all=[creator,...others];
  if(!others.length) return {ok:false,msg:'Pick at least one person.'};
  if(c.parent) return others.every(o=>PEOPLE[o].leader) ? {ok:true,approval:false,msg:'Parents can chat with leaders. No approval needed.'} : {ok:false,msg:'Parents can start chats with leaders only.'};
  const adults = all.filter(x=>PEOPLE[x].adult).length;
  if(all.some(x=>PEOPLE[x].youth) && adults<2){ const n=2-adults; return {ok:false,msg:`Chats with students need two approved adults. Pick ${n} more adult${n>1?'s':''} or leader${n>1?'s':''}.`}; }
  if(others.every(o=>PEOPLE[o].leader)) return {ok:true,approval:false,msg:'Only leaders are in this chat, so it opens right away.'};
  if(c.leader) return {ok:true,approval:false,msg:'You’re a leader, so this chat opens right away.'};
  if(c.youth && all.filter(x=>PEOPLE[x].leader).length>=2) return {ok:true,approval:false,msg:'Two leaders are in this chat, so it opens right away.'};
  return {ok:true,approval:true,msg:'A leader will approve this chat before it opens.'};
}

function createChat(name, members, plan){
  const others = members.filter(x=>x!==me()); const chk = checkChat(me(), others);
  if(!chk.ok){ toast(chk.msg); return null; }
  const c={id:'c'+(seq++), name, members:[me(),...others], plan, msgs:[], by:me(), status:chk.approval?'pending':'open'};
  CHATS.unshift(c); toast(chk.approval?'Sent to the leaders for approval':'Chat started');
  return c;
}

    <h2>Or pick people</h2>`:''}
    <label class="f" for="cname">Chat name (optional)<input type="text" id="cname" placeholder="e.g. Harmony practice"></label>
    ${group('Leaders',x=>PEOPLE[x].leader)}${group('Adults',x=>PEOPLE[x].adult&&!PEOPLE[x].leader)}${group('Youth',x=>PEOPLE[x].youth)}
    <div id="ruleNote"></div>
    <button class="btn teal" id="startChat" disabled style="opacity:.5">Pick at least one person</button>
    <p class="muted small">${foot}</p>`);
}
function refreshPick(){
  const chk = checkChat(me(), [...picked]);
  const b=$('#startChat'); b.disabled=!chk.ok; b.style.opacity=chk.ok?1:.5;
  b.textContent = !chk.ok ? (picked.size?'Can’t start this chat yet':'Pick at least one person') : chk.approval ? 'Send for leader approval' : 'Start chat';
  $('#ruleNote').innerHTML = picked.size ? `<div class="notice ${chk.ok&&!chk.approval?'info':'warn'}">${ic(chk.ok&&!chk.approval?'check':'shield')}<span>${chk.msg}</span></div>` : '';
}

/* ---------- Thread ---------- */
function openChat(c){
  c.unread=0; closeSheet(); render();
  const msgs = c.msgs.map(m=>`<div class="bubble ${m[0]===me()?'mine':''}">${m[0]===me()?'':`<span class="who">${first(m[0])}${PEOPLE[m[0]].youth?' · Youth':''}</span>`}<span>${esc(m[1])}</span><span class="t">${esc(m[2])}</span></div>`).join('');
  $('#threadLayer').innerHTML = `<div class="thread" role="dialog" aria-label="${esc(c.name)}">
    <header><button class="iconbtn" data-closethread aria-label="Back">${ic('back')}</button><div class="grow"><b>${esc(c.name)}</b><span>${c.members.map(first).join(', ')}</span></div>
    <button class="iconbtn" data-arch="${c.id}" data-closethread aria-label="${c.archived?'Restore':'Archive'} chat">${ic('arch')}</button></header>
    ${hasYouth(c)?`<div class="rule">${ic('shield','i s')}Youth chat · approved adults here: ${adultsIn(c).map(first).join(', ')}</div>`:''}
    ${c.approvedBy&&c.approvedBy!==c.by?`<div class="rule" style="background:var(--ok-bg);color:var(--ok-fg)">${ic('check','i s')}Approved by ${first(c.approvedBy)} (leader)</div>`:''}
    <div class="msgs" id="msgs">${msgs||`<p class="muted" style="text-align:center;margin:auto">${c.status==='open'?'Say hi to the team 👋':'No messages yet'}</p>`}</div>
    ${c.status==='open'?`<form id="sendForm" data-chat="${c.id}"><input id="msgIn" type="text" placeholder="Message ${esc(c.name)}" autocomplete="off"><button class="sendbtn" aria-label="Send">${ic('send')}</button></form>`
      :`<div class="notice ${c.status==='pending'?'warn':'alert'}" style="border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))">${c.status==='pending'?'Waiting for a leader to approve this chat. You can send messages once it’s approved.':'A leader didn’t approve this chat. Talk with a leader if you have questions.'}</div>`}</div>`;
  const box=$('#msgs'); box.scrollTop=box.scrollHeight;
}

/* ---------- Render ---------- */
function render(){
  document.querySelectorAll('.roles button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.role===S.role));
  const tabs = TABS[S.role]; if(!tabs.find(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  const unread = CHATS.filter(c=>c.members.includes(me())&&!c.archived).reduce((a,c)=>a+(c.unread||0),0);
  const openReq = REQ.filter(r=>r.who===me()&&r.st==='U').length;
  const pend = REQ.filter(r=>r.who==='maya'&&r.st==='P').length;
  const pendChats = CHATS.filter(c=>c.status==='pending').length;
  $('#tabs').style.setProperty('--cols', tabs.length);
  $('#tabs').innerHTML = tabs.map(([k,i])=>{
    const badge = k==='Chat'?unread : k==='Approvals'?pend : k==='Approve'?pendChats : (k==='Schedule'&&S.role!=='parent')?openReq : 0;
    return `<button data-go="${k}" ${S.tab===k?'aria-current="page"':''}>${ic(i)}${k}${badge?`<span class="badge">${badge}</span>`:''}</button>`;}).join('');
  $('#screen').innerHTML = V[S.tab]();
  $('#fabwrap').innerHTML = (S.tab==='Chat') ? `<button class="btn teal fab" id="newChat">${ic('plus','i s')}New chat</button>` : '';
}
function answer(i, yes){
  const r=REQ[i];
  if(S.role==='youth' && yes && !S.parentOk.has(r.plan)){ r.st='P'; r.sync='held'; render(); toast('Saved. We asked your parent to approve.'); return; }
  r.st = yes?'C':'D'; r.sync='syncing'; render(); toast(yes?'Accepted. Updating Planning Center…':'Declined. Updating Planning Center…');
  setTimeout(()=>{ r.sync='ok'; render(); }, 1400);
}

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-go]'); if(!t) return;
  const d = t.dataset;
  if(d.role){ S.role=d.role; S.tab=TABS[d.role][0][0]; S.archived=false; closeSheet(); render(); scrollTo(0,0); return; }
  if(d.go){ S.tab=d.go; S.archived=false; closeSheet(); render(); scrollTo(0,0); return; }
  if(d.accept){ answer(+d.accept,true); return; }
  if(d.decline){ answer(+d.decline,false); return; }
  if(d.papprove||d.pdecline){ const r=REQ[+(d.papprove||d.pdecline)]; const ok=!!d.papprove; if(ok) S.parentOk.add(r.plan); r.st=ok?'C':'D'; r.sync='syncing'; render(); toast(ok?'Approved. Updating Planning Center…':'Declined for Maya. Updating Planning Center…'); setTimeout(()=>{r.sync='ok';render();},1400); return; }
  if(d.arch){ const c=CHATS.find(x=>x.id===d.arch); c.archived=!c.archived; if(d.closethread!==undefined) $('#threadLayer').innerHTML=''; render(); toast(c.archived?`Archived “${c.name}”`:`Restored “${c.name}”`); return; }
  if(d.closethread!==undefined){ $('#threadLayer').innerHTML=''; render(); return; }
  if(d.plan){ planSheet(d.plan); return; }
  if(d.song){ songSheet(d.song, d.key); return; }
  if(d.chat && t.tagName==='BUTTON' && !t.closest('form')){ openChat(CHATS.find(x=>x.id===d.chat)); return; }
  if(d.teamchat){ const id=d.teamchat; let c=CHATS.find(x=>x.plan===id); if(c) c.archived=false; else c=createChat(PLANS[id].date.replace(',','')+' team', Object.keys(PLANS[id].team), id); if(c) openChat(c); return; }
  if(d.capprove||d.cdecline){ const c=CHATS.find(x=>x.id===(d.capprove||d.cdecline)); if(d.capprove){ c.status='open'; c.approvedBy=me(); toast(`Approved. “${c.name}” is open.`);} else { c.status='declined'; toast(`Declined. ${first(c.by)} will see it wasn’t approved.`);} render(); return; }
  if(d.pick){ picked.has(d.pick)?picked.delete(d.pick):picked.add(d.pick); t.setAttribute('aria-pressed', picked.has(d.pick)); refreshPick(); return; }
  if(t.id==='startChat'){ if(!checkChat(me(),[...picked]).ok) return; const nm=$('#cname').value.trim()||[...picked].slice(0,3).map(first).join(', '); const c=createChat(nm,[...picked]); if(c) openChat(c); return; }
  if(t.id==='newChat'){ newChatSheet(); return; }
  if(t.id==='toggleArch'){ S.archived=!S.archived; render(); return; }
  if(d.toast){ toast(d.toast); return; }
  if(t.id==='aboutBtn'){ sheet(`<div class="sechead"><h1>About this demo</h1>${closeBtn}</div>
    <p>A clickable prototype of a BRAC worship team app. Planning Center data is mocked: every name, song plan and date here is sample data. Nothing is sent anywhere.</p>
    <div class="card"><h3>What it shows</h3><ul class="plain small"><li>Schedule requests from Planning Center, answered in the app and synced back</li><li>Service plans, set lists, keys and playlists (no files)</li><li>Team chat you can start in one tap and archive just as fast</li><li>Youth section: parent approval and two approved adults in every chat</li><li>Leader in the loop: chats with anyone besides leaders wait for a leader’s approval</li><li>Parents can message leaders directly</li></ul></div>
    <div class="card"><h3>Questions for Bryson</h3><ul class="plain small"><li>Which Planning Center service types and teams should the app read?</li><li>Should a parent approve each date, or only joining the team?</li><li>Can parents read their student’s chats?</li><li>Who approves adults to be in chats with students?</li></ul></div>
    <p class="muted small">Prepared by AnalytiTech LLC · Discussion draft · Nov 2026</p>`); return; }
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='sendForm') return; e.preventDefault();
  const v=$('#msgIn').value.trim(); if(!v) return;
  const c=CHATS.find(x=>x.id===e.target.dataset.chat); c.msgs.push([me(),v,'Now']); openChat(c); $('#msgIn').focus();
});
render();
</script>

</body>
</html>
